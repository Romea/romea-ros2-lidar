driver:
  package: sick_scan_xd
  executable: sick_generic_caller
  plugin: none
  parameters:
    hostname:
      source:
        from: lidar_driver_configuration
        parameter: driver.parameters.hostname
    port:
      source:
        from: lidar_driver_configuration
        parameter: driver.parameters.port
    frame_id:
      source:
        from: lidar_configuration
        parameter: frame_id
    min_ang:
      source:
        from: lidar_configuration
        parameter: minimal_azimut_angle
      format: "{minimal_azimut_angle}*pi/180."
    max_ang:
      source:
        from: lidar_configuration
        parameter: maximal_azimut_angle
      format: "{maximal_azimut_angle}*pi/180."
    range_min:
      source:
        from: lidar_configuration
        parameter: minimal_range
    range_max:
      source:
        from: lidar_configuration
        parameter: maximal_range
    scanner_type: sick_mrs_6xxx
    # according sick_lms_1xx.launch from sick_scan_xd we need to specify these parameters
    sw_pll_only_publish: False
    #### common to all launch
    range_filter_handling: 0
    cloud_topic: cloud
    laserscan_topic: scan
    imu_topic: imu/data
    use_generation_timestamp: True
    ros_qos: -1
    tf_base_frame_id: foo
    tf_base_lidar_xyz_rpy: "0,0,0,0,0,0"
    tf_publish_rate: 0.0
    #### equal to default value
    # filter_echos: 2
