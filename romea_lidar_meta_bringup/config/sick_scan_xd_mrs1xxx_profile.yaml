driver:
  package: sick_scan_xd
  executable: sick_generic_caller
  plugin: none
  parameters:
    hostname:
      from: lidar_driver_configuration
    port:
      from: lidar_driver_configuration
    frame_id:
      from: lidar_configuration
      name: frame_id
    # ang_res:
    #   source:
    #     from: lidar_configuration
    #     parameter: azimut_resolution
    # scan_freq:
    #   source:
    #     from: lidar_configuration
    #     parameter: rate
    # uncomment ang_res and scan_freq if you want to configure the lidar
    min_ang:
      source:
        from: lidar_configuration
        parameter: minimal_azimut_angle
      format: "{minimal_azimut_angle}*pi/180."
      #scale: pi/180.
    max_ang:
      source:
        from: lidar_configuration
        parameter: maximal_azimut_angle
      format: "{maximal_azimut_angle}*pi/180."
      # scale: pi/180.
    range_min:
      source:
        from: lidar_configuration
        parameter: minimal_range
    range_max:
      source:
        from: lidar_configuration
        parmeter: maximal_range
    scanner_type: sick_mrs_1xxx
    # according sick_lms_1xx.launch from sick_scan_xd we need to specify these parameters
    intensity_resolution_16bit: False
    scandatacfg_azimuth_table: 1
    scan_layer_filter: "4 1 1 1 1" #default ""
    #### common to all launch
    range_filter_handling: 0
    cloud_topic: cloud
    laserscan_topic: scan
    imu_topic: imu/data
    sw_pll_only_publish: True
    use_generation_timestamp: True
    ros_qos: -1
    tf_base_frame_id: foo
    tf_base_lidar_xyz_rpy: "0,0,0,0,0,0"
    tf_publish_rate: 0.0
    #### equal to default value
    # imu_enable: False
    # imu_enable_additional_info: True not used
    # lfp_meanfilter: -1
    # lfp_medianfilter: -1
    # use_binary_protocol: True
    # timelimit: 5
    # min_intensity: 0.0
    # tick_to_timestamp_mode: 0
    # start_services: True
    # activate_lferec: True
    # activate_lidoutputstate: True
    # activate_lidinputstate: True
    # scandatacfg_timingflag: -1
    # add_transform_xyz_rpy: "0,0,0,0,0,0"
    # add_transform_check_dynamic_updates: False
    # message_monitoring_enabled: True
    # read_timeout_millisec_default: 5000
