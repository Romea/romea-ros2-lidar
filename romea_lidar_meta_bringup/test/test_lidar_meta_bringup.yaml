name: "lidar"
namespace: "ns"
launch:
  - include:
      file: "$(find-pkg-share romea_lidar_meta_bringup)/profile/sick_scan_xd_lms1xx.launch.py"
      arg:
        - name: ip
          value: "192.168.1.112"
        - name: port
          value: "2112"
configuration:
  manufacturer: sick
  model: lms151
  rate: 50 # hz
  azimut_resolution: 0.5 # degree
location:
  parent_link: "base_link"
  xyz: [1.0, 2.0, 3.0] # meters
  rpy: [4.0, 5.0, 6.0] # degrees
records:
  scan: true
  cloud: false
